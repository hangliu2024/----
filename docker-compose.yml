services:
  web:
    build: .
    container_name: asset-management
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=your-secret-key-change-in-production
      - DATABASE_URL=mysql+pymysql://asset_user:asset_password@db:3306/asset_management
      - AI_PROVIDER=ollama
      - OLLAMA_API_BASE=http://host.docker.internal:11434/v1
      - OLLAMA_MODEL=qwen3.5:9B
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/mysql:8.0
    container_name: asset-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=asset_management
      - MYSQL_USER=asset_user
      - MYSQL_PASSWORD=asset_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data: