{% extends "base.html" %}

{% block title %}创建稽查记录 - 资产管理系统{% endblock %}

{% block content %}
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px">
    <div>
        <h1 class="mi-page-title"><i class="bi bi-plus-circle"></i> 创建稽查记录</h1>
        <p style="font-size:14px;color:var(--text-hint);margin:4px 0 0">填写稽查记录详情</p>
    </div>
    <div class="mi-page-actions">
        <a href="{{ url_for('audit.record_list') }}" class="mi-btn mi-btn-default mi-btn-sm"><i class="bi bi-arrow-left"></i> 返回列表</a>
    </div>
</div>

<div class="mi-card" style="max-width:960px">
    <form method="POST" action="{{ url_for('audit.create_record') }}">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
            <div class="mi-form-group">
                <label class="mi-label">稽查类型 <span style="color:var(--danger)">*</span></label>
                <select class="mi-input" id="audit_type" name="audit_type" required>
                    <option value="security">安全稽查</option>
                    <option value="asset">资产稽查</option>
                    <option value="compliance">合规稽查</option>
                </select>
            </div>
            <div class="mi-form-group">
                <label class="mi-label">稽查范围</label>
                <input type="text" class="mi-input" id="audit_scope" name="audit_scope" placeholder="请输入稽查范围">
            </div>
            <div class="mi-form-group">
                <label class="mi-label">关联任务</label>
                <select class="mi-input" id="task_id" name="task_id">
                    <option value="">无关联任务</option>
                    {% for task in tasks %}
                    <option value="{{ task.id }}">{{ task.task_no }} - {{ task.task_title }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mi-form-group">
                <label class="mi-label">稽查日期</label>
                <input type="date" class="mi-input" id="audit_date" name="audit_date" value="{{ today }}">
            </div>
            <div class="mi-form-group" style="grid-column:1/3">
                <label class="mi-label">稽查内容 <span style="color:var(--danger)">*</span></label>
                <textarea class="mi-input" id="audit_content" name="audit_content" rows="4" required style="resize:vertical" placeholder="请描述稽查内容"></textarea>
            </div>
            <div class="mi-form-group" style="grid-column:1/3">
                <label class="mi-label">稽查结果</label>
                <textarea class="mi-input" id="audit_result" name="audit_result" rows="3" style="resize:vertical" placeholder="请描述稽查结果"></textarea>
            </div>
            <div class="mi-form-group" style="grid-column:1/3">
                <label class="mi-label">发现问题</label>
                <textarea class="mi-input" id="issue_found" name="issue_found" rows="3" style="resize:vertical" placeholder="请描述发现的问题"></textarea>
            </div>
            <div class="mi-form-group" style="grid-column:1/3">
                <label class="mi-label">改进建议</label>
                <textarea class="mi-input" id="suggestion" name="suggestion" rows="3" style="resize:vertical" placeholder="请描述改进建议"></textarea>
            </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:24px;padding-top:20px;border-top:1px solid var(--border-light)">
            <button type="submit" class="mi-btn mi-btn-primary"><i class="bi bi-check-lg"></i> 创建记录</button>
            <a href="{{ url_for('audit.record_list') }}" class="mi-btn mi-btn-default">取消</a>
        </div>
    </form>
</div>
{% endblock %}
