{% extends "base.html" %}
{% block title %}{% if item %}编辑报告{% else %}新增报告{% endif %} - 案件管理{% endblock %}
{% block content %}
<div class="mi-page-header">
    <h1 class="mi-page-title"><i class="bi bi-file-earmark-text"></i> {% if item %}编辑报告{% else %}新增报告{% endif %}</h1>
</div>
<div class="mi-card"><div class="mi-card-body">
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 24px">
            <div class="mi-form-group"><label class="mi-label">报告编号 <span style="color:var(--danger)">*</span></label>
                <input type="text" name="report_no" value="{{ item.report_no if item else '' }}" class="mi-input" required placeholder="如: RPT-2026-001"></div>
            <div class="mi-form-group"><label class="mi-label">报告标题 <span style="color:var(--danger)">*</span></label>
                <input type="text" name="report_title" value="{{ item.report_title if item else '' }}" class="mi-input" required></div>
            <div class="mi-form-group"><label class="mi-label">报告类型</label>
                <select name="report_type" class="mi-input mi-select"><option value="">请选择</option>
                    {% for t in ['初步调查','深入调查','结案报告'] %}<option value="{{ t }}" {% if item and item.report_type==t %}selected{% endif %}>{{ t }}</option>{% endfor %}
                </select></div>
            <div class="mi-form-group"><label class="mi-label">关联案例</label>
                <select name="case_id" class="mi-input mi-select"><option value="">请选择</option>
                    {% for c in cases %}<option value="{{ c.id }}" {% if item and item.case_id==c.id %}selected{% endif %}>{{ c.case_title }}</option>{% endfor %}
                </select></div>
            <div class="mi-form-group"><label class="mi-label">关联SOP</label>
                <select name="sop_id" class="mi-input mi-select"><option value="">请选择</option>
                    {% for s in sops %}<option value="{{ s.id }}" {% if item and item.sop_id==s.id %}selected{% endif %}>{{ s.sop_title }}</option>{% endfor %}
                </select></div>
            <div class="mi-form-group"><label class="mi-label">调查人员</label>
                <input type="text" name="investigator" value="{{ item.investigator if item else '' }}" class="mi-input"></div>
            <div class="mi-form-group"><label class="mi-label">调查日期</label>
                <input type="date" name="investigation_date" value="{{ item.investigation_date if item else '' }}" class="mi-input"></div>
            <div class="mi-form-group"><label class="mi-label">涉及部门</label>
                <input type="text" name="dept_name" value="{{ item.dept_name if item else '' }}" class="mi-input"></div>
            <div class="mi-form-group"><label class="mi-label">状态</label>
                <select name="status" class="mi-input mi-select">
                    {% for s in [('draft','草稿'),('submitted','已提交'),('approved','已审批'),('rejected','已驳回')] %}<option value="{{ s[0] }}" {% if item and item.status==s[0] %}selected{% endif %}>{{ s[1] }}</option>{% endfor %}
                </select></div>
        </div>
        <div class="mi-form-group"><label class="mi-label">事件概述</label>
            <textarea name="incident_summary" class="mi-input mi-textarea" rows="3">{{ item.incident_summary if item else '' }}</textarea></div>
        <div class="mi-form-group"><label class="mi-label">调查过程</label>
            <textarea name="investigation_process" class="mi-input mi-textarea" rows="3">{{ item.investigation_process if item else '' }}</textarea></div>
        <div class="mi-form-group"><label class="mi-label">调查发现</label>
            <textarea name="findings" class="mi-input mi-textarea" rows="3">{{ item.findings if item else '' }}</textarea></div>
        <div class="mi-form-group"><label class="mi-label">证据描述</label>
            <textarea name="evidence_description" class="mi-input mi-textarea" rows="3">{{ item.evidence_description if item else '' }}</textarea></div>
        <div class="mi-form-group"><label class="mi-label">调查结论</label>
            <textarea name="conclusion" class="mi-input mi-textarea" rows="3">{{ item.conclusion if item else '' }}</textarea></div>
        <div class="mi-form-group"><label class="mi-label">处理建议</label>
            <textarea name="suggestions" class="mi-input mi-textarea" rows="3">{{ item.suggestions if item else '' }}</textarea></div>
        <div class="mi-form-group"><label class="mi-label">备注</label>
            <textarea name="remark" class="mi-input mi-textarea" rows="2">{{ item.remark if item else '' }}</textarea></div>
        <div style="display:flex;gap:12px;padding-top:16px;border-top:1px solid var(--border-light)">
            <button type="submit" class="mi-btn mi-btn-primary"><i class="bi bi-check-lg"></i> 保存</button>
            <a href="{{ url_for('case_management.reports') }}" class="mi-btn mi-btn-default"><i class="bi bi-x-lg"></i> 取消</a>
        </div>
    </form>
</div></div>
{% endblock %}
