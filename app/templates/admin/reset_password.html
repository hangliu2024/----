{% extends "base.html" %}

{% block title %}重置密码 - 资产管理系统{% endblock %}

{% block content %}
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px">
    <div>
        <h1 class="mi-page-title"><i class="bi bi-key"></i> 重置用户密码</h1>
    </div>
    <div class="mi-page-actions">
        <a href="{{ url_for('admin.users') }}" class="mi-btn mi-btn-default mi-btn-sm"><i class="bi bi-arrow-left"></i> 返回列表</a>
    </div>
</div>

<div class="mi-card" style="max-width:500px">
    <div style="padding:12px 16px;background:var(--bg);border-radius:var(--radius);margin-bottom:20px;display:flex;align-items:center;gap:8px">
        <i class="bi bi-person" style="color:var(--accent)"></i>
        <span>为用户 <strong>{{ user.username }}</strong> ({{ user.real_name or user.email }}) 重置密码</span>
    </div>
    <form method="POST">
        <div class="mi-form-group">
            <label class="mi-label">新密码 <span style="color:var(--danger)">*</span></label>
            <input type="password" class="mi-input" id="new_password" name="new_password" required minlength="6">
        </div>
        <div class="mi-form-group">
            <label class="mi-label">确认密码 <span style="color:var(--danger)">*</span></label>
            <input type="password" class="mi-input" id="confirm_password" name="confirm_password" required minlength="6">
        </div>
        <div style="display:flex;gap:8px;margin-top:20px;padding-top:20px;border-top:1px solid var(--border-light)">
            <button type="submit" class="mi-btn mi-btn-warning"><i class="bi bi-check-circle"></i> 确认重置</button>
            <a href="{{ url_for('admin.users') }}" class="mi-btn mi-btn-default">取消</a>
        </div>
    </form>
</div>
{% endblock %}
